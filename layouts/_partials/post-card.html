<article class="post-card">
  <div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}"># {{ .LinkTitle }}</a>{{ end }}</div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Description | default (.Summary | plainify | htmlUnescape | truncate 160) }}</p>
  <a class="read-link" href="{{ .RelPermalink }}" aria-label="阅读：{{ .Title }}">阅读全文 <span aria-hidden="true">↗</span></a>
</article>
