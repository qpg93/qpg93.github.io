<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="author" content="{{ site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="{{ if eq .Section "posts" }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <link rel="icon" href="{{ "images/favicon.ico" | relURL }}" sizes="any">
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "feed.xml" | relURL }}">
  <script>
    document.documentElement.classList.add('js');
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="qpg93 博客首页"><span class="brand-mark" aria-hidden="true">q.</span><span>qpg93<span class="brand-suffix"> / blog</span></span></a>
      <nav aria-label="主导航">
        <a href="{{ site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>文章</a>
        <a href="{{ "tags/" | relURL }}" {{ if eq .Section "tags" }}aria-current="page"{{ end }}>标签</a>
        <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink "/about/" }}aria-current="page"{{ end }}>关于</a>
        <button class="theme-toggle" type="button" aria-label="切换深浅主题" title="切换深浅主题"><span aria-hidden="true">◐</span></button>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer">
      <span>© {{ now.Year }} qpg93 <span class="footer-note">· 记录想记录的一切</span></span>
      <div><a href="{{ site.Params.github }}" rel="me">GitHub ↗</a><a href="{{ "feed.xml" | relURL }}">RSS ↗</a><span class="built-with">Built with Hugo</span></div>
    </footer>
  </div>
</body>
</html>
