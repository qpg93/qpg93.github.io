<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="author" content="{{ site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="{{ if eq .Section "posts" }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <link rel="icon" href="{{ "images/favicon.ico" | relURL }}" sizes="any">
  <script>
    document.documentElement.classList.add('js');
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ if .Params.charts }}<link rel="stylesheet" href="{{ "css/charts.css" | relURL }}">{{ end }}
  <script src="{{ "js/site.js" | relURL }}" defer></script>
  {{ if .Params.charts }}<script src="{{ "js/charts.js" | relURL }}" defer></script>{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="qpg93 blog home"><span class="brand-mark" aria-hidden="true">q.</span><span>qpg93<span class="brand-suffix"> / blog</span></span></a>
      <nav aria-label="Main navigation">
        <a href="{{ site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>Journal</a>
        <a href="{{ "tags/" | relURL }}" {{ if eq .Section "tags" }}aria-current="page"{{ end }}>Tags</a>
        <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink "/about/" }}aria-current="page"{{ end }}>About</a>
        <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode" title="Toggle light and dark mode"><span aria-hidden="true">◐</span></button>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer">
      <span>© {{ now.Year }} qpg93 <span class="footer-note">· Notes on life and everything in between</span></span>
      <div><a href="{{ site.Params.github }}" rel="me">GitHub ↗</a><span class="built-with">Built with Hugo</span></div>
    </footer>
  </div>
</body>
</html>
