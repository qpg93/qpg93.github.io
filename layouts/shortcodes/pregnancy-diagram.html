{{- $kind := .Get 0 -}}
{{- $id := printf "diagram-%s-%d" .Page.File.UniqueID .Ordinal -}}
<figure class="pregnancy-diagram">
{{ if eq $kind "nt" }}
  <figcaption><span class="eyebrow">EXPLAINER · NOT A PATIENT IMAGE</span><h3>What does NT measure?</h3></figcaption>
  <svg viewBox="0 0 680 300" role="img" aria-labelledby="{{ $id }}-title {{ $id }}-desc">
    <title id="{{ $id }}-title">NT measurement location, simplified side-view diagram</title>
    <desc id="{{ $id }}-desc">The highlighted area represents fluid at the back of the fetal neck. This is an original educational schematic, not an ultrasound image, not to scale, and not a guide to performing a measurement.</desc>
    <path class="diagram-envelope" d="M115 225 C60 180 70 65 150 40 C230 8 340 42 365 110 C395 190 315 260 220 266 C170 270 140 250 115 225Z" />
    <path class="diagram-body" d="M220 145 C185 142 157 163 159 199 C164 236 206 245 240 221 C259 206 259 183 245 172" />
    <circle class="diagram-body" cx="229" cy="104" r="45" />
    <path class="diagram-detail" d="M195 175 Q230 167 235 193 M185 211 Q206 222 221 207" />
    <path class="diagram-highlight" d="M270 126 Q285 146 264 165" />
    <line class="diagram-leader" x1="279" y1="145" x2="425" y2="116" />
    <circle class="diagram-marker" cx="279" cy="145" r="4" />
    <text class="diagram-label" x="430" y="108">Fluid at the</text><text class="diagram-label" x="430" y="132">back of the neck</text>
    <text class="diagram-small" x="430" y="171">NT = nuchal translucency</text>
    <text class="diagram-small" x="430" y="194">Location only, not to scale</text>
  </svg>
  <p class="diagram-source">Original schematic. Reference: <a href="https://www.nhs.uk/pregnancy/your-pregnancy-care/12-week-scan/">NHS — 12-week scan</a>. The illustration does not reproduce or interpret an individual scan.</p>
{{ else if eq $kind "position" }}
  <figcaption><span class="eyebrow">EXPLAINER · NOT A PATIENT IMAGE</span><h3>Head-down and breech positions</h3></figcaption>
  <svg viewBox="0 0 680 360" role="img" aria-labelledby="{{ $id }}-title {{ $id }}-desc">
    <title id="{{ $id }}-title">Simplified comparison of head-down and breech positions</title>
    <desc id="{{ $id }}-desc">Two schematic outlines compare a head-down fetus with a head-up fetus whose bottom is nearer the cervix. Actual breech positions vary. This does not depict Yoyo's exact posture or determine delivery options.</desc>
    {{ range $index, $offset := slice 0 330 }}
    <g transform="translate({{ $offset }} 0)">
      <path class="diagram-envelope" d="M130 272 C120 245 63 217 69 142 C72 72 110 42 165 42 C220 42 258 72 261 142 C267 217 210 245 200 272 L195 296 L135 296Z" />
      {{ if eq $index 0 }}
        <circle class="diagram-body" cx="165" cy="227" r="29" />
        <path class="diagram-body" d="M147 195 C105 182 105 118 145 105 C186 88 225 134 209 170 C203 186 185 198 175 200" />
        <path class="diagram-detail" d="M143 132 Q171 147 184 124 M129 169 Q154 184 175 162" />
      {{ else }}
        <circle class="diagram-body" cx="165" cy="102" r="29" />
        <path class="diagram-body" d="M145 132 C111 151 114 210 152 226 C190 246 224 207 207 172 C200 155 185 140 176 135" />
        <path class="diagram-detail" d="M143 196 Q163 159 185 149 M153 219 Q172 184 199 169" />
      {{ end }}
      <text class="diagram-label" x="165" y="331" text-anchor="middle">{{ if eq $index 0 }}Head-down{{ else }}Breech (one example){{ end }}</text>
    </g>
    {{ end }}
    <text class="diagram-small" x="340" y="353" text-anchor="middle">The cervix is shown at the bottom. Positions and proportions are simplified.</text>
  </svg>
  <p class="diagram-source">Original schematic. Reference: <a href="https://www.nhs.uk/pregnancy/labour-and-birth/if-your-baby-is-breech/">NHS — What happens if your baby is breech?</a>. Not a prediction of the position at birth.</p>
{{ else }}
  {{ errorf "Unknown pregnancy diagram %q" $kind }}
{{ end }}
</figure>
