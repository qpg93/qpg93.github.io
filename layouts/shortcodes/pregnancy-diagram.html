{{- $kind := .Get 0 -}}
<figure class="pregnancy-diagram">
{{ if eq $kind "nt" }}
  <figcaption><span class="eyebrow">OPENSTAX · EDUCATIONAL ILLUSTRATION</span><h3>Nuchal translucency (NT)</h3></figcaption>
  <img class="explainer-image explainer-image-nt" src="{{ "images/pregnancy/nuchal-translucency.webp" | relURL }}" width="472" height="608" loading="lazy" decoding="async" alt="Textbook illustration with a double-headed arrow marking the fluid space behind the fetal neck. Not an image of Yoyo." />
  <p class="diagram-source">Rice University / OpenStax, <cite>Maternal-Newborn Nursing</cite>, <a href="https://openstax.org/books/maternal-newborn-nursing/pages/13-1-prenatal-testing-during-the-first-trimester">Figure 13.3, Nuchal Translucency</a>. <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>. Reproduced without alteration for noncommercial educational use. Not a patient image.</p>
{{ else if eq $kind "position" }}
  <figcaption><span class="eyebrow">OPENSTAX · EDUCATIONAL ILLUSTRATION</span><h3>Fetal presentations</h3></figcaption>
  <img class="explainer-image explainer-image-position" src="{{ "images/pregnancy/fetal-presentations.webp" | relURL }}" width="840" height="1078" loading="lazy" decoding="async" alt="Textbook comparison: (a) frank breech, (b) complete breech, (c) footling breech, and (d) shoulder presentation. Panel d is not a type of breech. Not Yoyo's individual position." />
  <p class="diagram-source">Rice University / OpenStax, <cite>Maternal-Newborn Nursing</cite>, <a href="https://openstax.org/books/maternal-newborn-nursing/pages/15-1-factors-influencing-the-process-of-labor-and-birth">Figure 15.9, Different Types of Breech Presentation</a>. <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>. Reproduced without alteration for noncommercial educational use. Panel (d) shows a shoulder presentation, not breech.</p>
{{ else }}
  {{ errorf "Unknown pregnancy diagram %q" $kind }}
{{ end }}
</figure>
