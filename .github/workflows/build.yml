name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo (standard edition)
        run: |
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" checksums.txt | sed 's|hugo_.*_linux-amd64.tar.gz|hugo.tar.gz|' | sha256sum --check --strict
          mkdir -p hugo-bin
          tar -xzf hugo.tar.gz -C hugo-bin hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "$GITHUB_PATH"
      - name: Build
        run: hugo --gc --minify --panicOnWarning
      - name: Test generated site
        run: python3 scripts/check-site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
